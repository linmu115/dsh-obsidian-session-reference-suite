bindings:
- id: REQ-selection
  kind: requirement
  title: 从笔记选段进入真实会话
  source_id: source-1
  heading: 笔记选段引用
  status: current
  summary: 选段等待认领，进入气泡后由用户随问题发送，保留已有草稿。
  aliases:
  - REQ-note-delivery
- id: REQ-links
  kind: requirement
  title: 笔记关联与独立会话贴纸
  source_id: source-1
  heading: 笔记关联和会话贴纸
  status: current
  summary: 打开笔记是导航；引用到会话才传递材料。
- id: REQ-delete
  kind: requirement
  title: 取消、删除与数据归属
  source_id: source-1
  heading: 删除与数据归属
  status: current
  summary: 只清理对应引用和受拥有权保护的标记，不删除笔记或真实会话。
- id: IMP-config
  kind: implementation
  title: 安装与配置路径
  source_id: source-1
  heading: 安装与配置
  status: current
  summary: 单一父包、匹配 profile/实例、Companion 与 Maintenance 扩展声明。
- id: IMP-recovery
  kind: implementation
  title: 连接异常怎样处理
  source_id: source-1
  heading: 连接恢复
  status: current
  summary: 离线保留待处理资料；显式重试与冲突处理，不把不在线等同删除。
- id: VER-history
  kind: verification
  title: 组合引用生命周期的历史回归
  source_id: source-7
  heading: 图谱引用生命周期包组
  status: current
  summary: 旧 rc2.15 包组 12 项测试记录，不冒充当前 rc2.18 的重新验收。
- id: XR05
  kind: requirement
  title: 进入真实目标后再添加引用
  source_id: graph-req
  status: current
  summary: 打开目标完整会话并等待输入框绑定。
  row_id: XR05
- id: XR07
  kind: requirement
  title: 用户明确发送才启动模型
  source_id: graph-req
  status: current
  summary: 目标选择本身不发送、不启动 AI。
  row_id: XR07
- id: XR08
  kind: requirement
  title: 保留草稿并保证添加幂等
  source_id: graph-req
  status: current
  summary: 原文字、附件和引用保留；同一操作重试不重复添加。
  row_id: XR08
- id: CUT03
  kind: requirement
  title: 固定截止使用稳定回复身份
  source_id: graph-req
  status: current
  summary: 不能以屏幕位置、数组下标或临时 runId 代替完成回复身份。
  row_id: CUT03
- id: CUT05
  kind: requirement
  title: 来源追加不扩大已有引用
  source_id: graph-req
  status: current
  summary: 更新更晚的上游需要明确的新引用修订。
  row_id: CUT05
- id: ST08
  kind: requirement
  title: 分别删除入口、关系、贴纸与会话
  source_id: graph-req
  status: current
  summary: 四类删除操作不能互相代替。
  row_id: ST08
- id: ST11
  kind: requirement
  title: 蓝色来源引用与红色普通贴纸共存
  source_id: graph-req
  status: current
  summary: 蓝色标记属于引用；普通贴纸和既有高亮保持。
  row_id: ST11
- id: NC02
  kind: requirement
  title: 授权、窗口、保留材料分开
  source_id: native-req
  status: current
  summary: 固定授权上限、活动窗口和当前模型保留是三种状态。
  row_id: NC02
- id: NC07
  kind: requirement
  title: 原生上下文释放的引擎范围
  source_id: native-req
  status: current
  summary: 当前新增能力限定 DSH 原生 Agent，不宣称托管引擎支持。
  row_id: NC07
- id: NC08
  kind: requirement
  title: 持续复用会话真源和扩展 Adapter
  source_id: native-req
  status: current
  summary: 保留每会话主干，不增加全量上游或逐轮请求备份。
  row_id: NC08
- id: REQ-linked-note
  kind: requirement
  title: 关联笔记的导航与本轮引用
  source_id: linked-note-spec
  status: current
  summary: 关联气泡按需取正文，直接绑定当前会话并保留草稿。
  heading: 会话页关联笔记气泡与按需引用
- id: REQ-marker-cleanup
  kind: requirement
  title: 最后一个使用方解除后清理自有标记
  source_id: marker-spec
  status: current
  summary: 只清理有归属记录的插件标记；共享使用和用户块 ID 受保护。
  heading: 用户可见行为
- id: REQ-directory-owner
  kind: requirement
  title: 业务目录按真实所属会话组织
  source_id: ownership-spec
  status: current
  summary: X → Y 属于接收方 Y；references 不等于 ownership，未知归属待核验。
  heading: 业务 Adapter 与所属会话
- id: IF-core-directory
  kind: interface
  title: Core 提供的轻量引用目录
  source_id: directory-contract
  status: current
  summary: 提供方唯一目录合同：分页只读、有界摘录、持久变更通知、明确删除；消费方见 INT-maintenance-directory。
  heading: 接口与边界
